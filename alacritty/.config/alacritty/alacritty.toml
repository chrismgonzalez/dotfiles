# Alacritty Configuration
# See: https://alacritty.org/config-alacritty.html

[window]
# Window dimensions (changes require restart)
dimensions = { columns = 120, lines = 40 }

# Window padding
padding = { x = 10, y = 10 }

# Spread additional padding evenly around the terminal content
dynamic_padding = true

# Window decorations
decorations = "Full"

# Startup Mode
startup_mode = "Windowed"

# Background opacity
opacity = 0.90

[scrolling]
# Maximum number of lines in the scrollback buffer
history = 10000

# Number of lines scrolled for every input scroll increment
multiplier = 3

[font]
# Normal font face - FiraCode Nerd Font with ligatures and icons
normal = { family = "FiraCode Nerd Font", style = "Regular" }

# Bold font face
bold = { family = "FiraCode Nerd Font", style = "Bold" }

# Italic font face  
italic = { family = "FiraCode Nerd Font", style = "Italic" }

# Bold italic font face
bold_italic = { family = "FiraCode Nerd Font", style = "Bold Italic" }

# Font size
size = 14.0

# Offset is the extra space around each character
offset = { x = 0, y = 0 }

# Glyph offset determines the locations of the glyphs within their cells
glyph_offset = { x = 0, y = 0 }

# Use built-in font for box drawing characters
builtin_box_drawing = true

[colors]
# Tokyo Night color scheme

[colors.primary]
background = "#1a1b26"
foreground = "#c0caf5"

[colors.normal]
black   = "#15161e"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#a9b1d6"

[colors.bright]
black   = "#414868"
red     = "#f7768e"
green   = "#9ece6a"
yellow  = "#e0af68"
blue    = "#7aa2f7"
magenta = "#bb9af7"
cyan    = "#7dcfff"
white   = "#c0caf5"

[cursor]
# Cursor style
style = { shape = "Block", blinking = "On" }

# Cursor blinking interval in milliseconds
blink_interval = 750

# If this is true, the cursor will be rendered as a hollow box when unfocused
unfocused_hollow = true

[selection]
# This string contains all characters that are used as separators for "semantic words" in Alacritty
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

# When set to true, selected text will be copied to the primary clipboard
save_to_clipboard = true

[mouse]
# If this is true, the cursor is temporarily hidden when typing
hide_when_typing = true

[[hints.enabled]]
# Terminal hints can be used to find text or hyperlinks in the visible part of the terminal
command = "open"
hyperlinks = true
post_processing = true
persist = false
binding = { key = "U", mods = "Control|Shift" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"

[hints.enabled.mouse]
enabled = true

[keyboard]
bindings = [
    # Copy/Paste
    { key = "V", mods = "Command", action = "Paste" },
    { key = "C", mods = "Command", action = "Copy" },
    { key = "Q", mods = "Command", action = "Quit" },
    { key = "N", mods = "Command", action = "CreateNewWindow" },
    
    # Font size
    { key = "Plus", mods = "Command", action = "IncreaseFontSize" },
    { key = "Minus", mods = "Command", action = "DecreaseFontSize" },
    { key = "Key0", mods = "Command", action = "ResetFontSize" },
    
    # Scrolling
    { key = "K", mods = "Command", action = "ScrollPageUp" },
    { key = "J", mods = "Command", action = "ScrollPageDown" },
    { key = "Home", mods = "Shift", action = "ScrollToTop" },
    { key = "End", mods = "Shift", action = "ScrollToBottom" },
]

[bell]
# Visual bell animation
animation = "EaseOutExpo"
duration = 0
color = "#ffffff"

[debug]
# Display the time it takes to redraw each frame
render_timer = false

# Keep the log file after quitting Alacritty
persistent_logging = false

# Log level
log_level = "Warn"

# Print all received window events
print_events = false
