---
- name: Install APT packages
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
    update_cache: yes
  become: yes
  when: apt_packages is defined

- name: Install external packages
  ansible.builtin.shell: "{{ item.install_script }}"
  args:
    creates: "/usr/local/bin/{{ item.name }}"
  loop: "{{ external_packages }}"
  when: external_packages is defined
