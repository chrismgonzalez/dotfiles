---
- name: Check if uv is installed
  ansible.builtin.command: which uv
  register: uv_check
  failed_when: false
  changed_when: false

- name: Install Python via uv
  ansible.builtin.command: "uv python install {{ python_version }}"
  when: uv_check.rc == 0
  register: python_install
  changed_when: "'already installed' not in python_install.stdout"
  failed_when: false

- name: Verify Python installation
  ansible.builtin.command: python3 --version
  register: python_version_check
  changed_when: false
  failed_when: false
