---
- name: Check if Xcode Command Line Tools are installed
  ansible.builtin.stat:
    path: /Library/Developer/CommandLineTools
  register: xcode_tools

- name: Install Xcode Command Line Tools
  ansible.builtin.command: xcode-select --install
  when: not xcode_tools.stat.exists
  register: xcode_install
  failed_when: false
  changed_when: xcode_install.rc == 0

- name: Check if Homebrew is installed
  ansible.builtin.stat:
    path: /opt/homebrew/bin/brew
  register: homebrew_intel

- name: Check if Homebrew is installed (Intel)
  ansible.builtin.stat:
    path: /usr/local/bin/brew
  register: homebrew_arm
  when: not homebrew_intel.stat.exists

- name: Install Homebrew
  ansible.builtin.shell: |
    /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  when: not (homebrew_intel.stat.exists or homebrew_arm.stat.exists)
  become: false

- name: Add Homebrew to PATH (Apple Silicon)
  ansible.builtin.lineinfile:
    path: "{{ ansible_env.HOME }}/.zprofile"
    line: 'eval "$(/opt/homebrew/bin/brew shellenv)"'
    create: yes
  when: homebrew_intel.stat.exists

- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: yes
  when: homebrew_intel.stat.exists or homebrew_arm.stat.exists

- name: Create macOS-specific directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ macos_directories }}"
  when: macos_directories is defined
