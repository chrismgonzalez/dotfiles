---
- name: Setup Development Environment
  hosts: localhost
  connection: local
  
  vars_files:
    - vars/common.yml
    - "vars/{{ ansible_os_family | lower }}.yml"
  
  pre_tasks:
    - name: Gather facts
      ansible.builtin.setup:
      tags: always
    
    - name: Display OS information
      ansible.builtin.debug:
        msg: "Setting up {{ ansible_distribution }} {{ ansible_distribution_version }} ({{ ansible_os_family }})"
      tags: always
  
  roles:
    - role: prerequisites
      tags: prerequisites
    
    - role: packages
      tags: packages
    
    - role: languages
      tags: languages
    
    - role: dotfiles
      tags: dotfiles
  
  post_tasks:
    - name: Setup complete
      ansible.builtin.debug:
        msg: "Development environment setup complete! 🎉"
      tags: always
